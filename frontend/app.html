<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console. Restock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --snow: #f5f3ef; --white: #ffffff; --ink: #16140f;
    --red: #e23b2e; --red-deep: #c22d22;
    --cobalt: #2547d0; --mustard: #efaf1b; --mustard-text: #a87b06; --forest: #1d6b45;
    --line: #dedbd3;
    --ink-dim: #6b675e; --ink-faint: #8b877d;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--snow);
    color: var(--ink);
    font-family: "Archivo", -apple-system, sans-serif;
    min-height: 100vh;
  }
  a { color: var(--cobalt); }
  .mono { font-family: "Courier Prime", monospace; }

  .flagline { height: 5px; display: flex; }
  .flagline i { flex: 1; }
  .flagline i:nth-child(1){background:var(--red)} .flagline i:nth-child(2){background:var(--cobalt)}
  .flagline i:nth-child(3){background:var(--mustard)} .flagline i:nth-child(4){background:var(--forest)}

  header {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 32px;
    border-bottom: 2px solid var(--ink);
    background: rgba(245, 243, 239, 0.9);
    position: sticky; top: 0; backdrop-filter: blur(8px); z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-family: "Archivo Black", sans-serif; font-size: 17px; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--red);
    display: grid; place-items: center; font-size: 15px; color: var(--white);
  }
  .tagline { color: var(--ink-faint); font-size: 11px; font-family: "Courier Prime", monospace; font-weight: 700; letter-spacing: .14em; }
  nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  nav button {
    background: none; border: 2px solid transparent; color: var(--ink-dim);
    padding: 8px 16px; border-radius: 999px; font-size: 14px; cursor: pointer; font-weight: 600;
    font-family: "Archivo", sans-serif;
  }
  nav button:hover { color: var(--ink); background: var(--white); }
  nav button.active { color: var(--ink); background: var(--white); border-color: var(--ink); }
  .logout { color: var(--ink-faint) !important; font-size: 13.5px !important; }
  .logout:hover { color: var(--red) !important; }

  main { max-width: 1080px; margin: 0 auto; padding: 32px; }
  h1 { font-family: "Archivo Black", sans-serif; font-weight: 400; text-transform: uppercase; font-size: 28px; margin-bottom: 4px; }
  .sub { color: var(--ink-dim); font-size: 14.5px; margin-bottom: 24px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card {
    background: var(--white); border-radius: var(--radius);
    padding: 18px; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
    animation: rise .45s cubic-bezier(.2,.8,.3,1) both;
    box-shadow: 0 2px 8px rgba(22,20,15,.06);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .card:hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: 0 14px 30px rgba(22,20,15,.13); }
  .card .m-name { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .card .m-loc { color: var(--ink-faint); font-size: 12.5px; text-transform: capitalize; margin-bottom: 14px; }
  .card .m-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .m-note { color: var(--ink-dim); font-size: 12px; text-align: right; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 11.5px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    font-family: "Courier Prime", monospace; letter-spacing: .03em; color: var(--white);
  }
  .badge.red { background: var(--red); }
  .badge.red::before { content: "●"; font-size: 8px; animation: pulse 1.2s ease infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .badge.yellow { background: var(--mustard); color: var(--ink); }
  .badge.green { background: var(--forest); }

  .back { background: none; border: none; color: var(--cobalt); font-size: 14.5px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 18px; font-family: "Archivo", sans-serif; }
  .detail-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .panel {
    background: var(--white); border-radius: var(--radius);
    padding: 20px; margin-top: 20px; animation: rise .45s cubic-bezier(.2,.8,.3,1) both;
    box-shadow: 0 2px 8px rgba(22,20,15,.06);
  }
  .panel h2 { font-family: "Archivo Black", sans-serif; font-weight: 400; text-transform: uppercase; font-size: 15.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--ink-faint); font-weight: 700; font-size: 10.5px; font-family: "Courier Prime", monospace;
       text-transform: uppercase; letter-spacing: 0.12em; padding: 8px 10px; border-bottom: 2px solid var(--ink); }
  td { padding: 10px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .days-chip { font-weight: 700; font-family: "Courier Prime", monospace; font-size: 12.5px; }
  .days-chip.red { color: var(--red); } .days-chip.yellow { color: var(--mustard-text); } .days-chip.green { color: var(--forest); }

  .flag {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--ink);
    background: var(--mustard); border-radius: 6px; padding: 2px 8px; margin-left: 8px;
  }
  .order-total-row td { font-weight: 700; border-top: 2px solid var(--ink); font-size: 15px; }

  .cap-bar { height: 10px; border-radius: 999px; background: var(--snow); border: 1px solid var(--line); overflow: hidden; margin: 10px 0 6px; }
  .cap-fill { height: 100%; border-radius: 999px; background: var(--mustard); transition: width .8s cubic-bezier(.2,.8,.3,1); }
  .cap-fill.over { background: var(--red); }
  .cap-label { font-size: 12.5px; color: var(--ink-dim); display: flex; justify-content: space-between; }

  .banner { border-radius: 12px; padding: 13px 15px; font-size: 14px; margin-top: 14px; line-height: 1.55; font-weight: 500; }
  .banner.block { background: var(--red); color: var(--white); }
  .banner.ok { background: var(--forest); color: var(--white); }
  .banner.warn { background: var(--mustard); color: var(--ink); }
  .banner.ok a { color: var(--white); font-weight: 700; }

  .btn {
    border: none; border-radius: 999px; padding: 13px 26px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; margin-top: 16px; font-family: "Courier Prime", monospace; letter-spacing: .05em;
    background: var(--red); color: var(--white); box-shadow: 0 5px 0 var(--red-deep);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--red-deep); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-deep); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  .empty { color: var(--ink-faint); font-size: 14.5px; padding: 24px; text-align: center; }
  .guard-note { font-size: 12.5px; color: var(--ink-faint); margin-top: 10px; }
</style>
</head>
<body>
<div class="flagline"><i></i><i></i><i></i><i></i></div>
<header>
  <div class="logo"><div class="logo-mark">⟳</div>Restock</div>
  <div class="tagline">FLEET CONSOLE · OWNER SESSION</div>
  <nav>
    <button id="nav-fleet" onclick="go('fleet')">Fleet</button>
    <button id="nav-audit" onclick="go('audit')">Audit Log</button>
    <button class="logout" onclick="logout()">Log out</button>
  </nav>
</header>
<main id="app"><div class="empty">Loading fleet data…</div></main>

<script>
// Demo auth gate. Owners only.
if (sessionStorage.getItem('restock_auth') !== 'owner') location.replace('login.html');
function logout() { sessionStorage.removeItem('restock_auth'); location.href = 'index.html'; }

const SPEND_CAP = 200;
const MARGIN_FLOOR = 1.3;
const TARGET_DAYS = 14;
const AUDIT_KEY = 'restock_audit_log';

let DATA = null;
let route = { view: 'fleet', machine: null };

const fmt$ = n => '$' + n.toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function daysClass(d) {
  if (d == null) return 'green';
  return d <= 3 ? 'red' : d <= 7 ? 'yellow' : 'green';
}
function machineStatus(m) {
  const worst = Math.min(...m.skus.map(s => s.days_until_stockout ?? 99));
  return daysClass(worst);
}
function urgentSkus(m) {
  return m.skus.filter(s => (s.days_until_stockout ?? 99) <= 7);
}
function orderLines(m) {
  return urgentSkus(m).map(s => {
    const qty = Math.max(0, Math.ceil(s.avg_daily_sales * TARGET_DAYS - s.current_stock));
    return { ...s, qty, lineCost: qty * s.unit_cost,
             marginFlag: s.unit_price < s.unit_cost * MARGIN_FLOOR };
  }).filter(l => l.qty > 0);
}

function getAudit() {
  try { return JSON.parse(localStorage.getItem(AUDIT_KEY)) || []; }
  catch { return []; }
}
function saveAudit(entries) { localStorage.setItem(AUDIT_KEY, JSON.stringify(entries)); }

function go(view, machine) {
  route = { view, machine: machine || null };
  render();
  window.scrollTo(0, 0);
}

function render() {
  document.getElementById('nav-fleet').className = route.view !== 'audit' ? 'active' : '';
  document.getElementById('nav-audit').className = route.view === 'audit' ? 'active' : '';
  const app = document.getElementById('app');
  if (route.view === 'audit') app.innerHTML = renderAudit();
  else if (route.view === 'machine') app.innerHTML = renderMachine(route.machine);
  else app.innerHTML = renderFleet();
}

/* ---------- Fleet ---------- */
function renderFleet() {
  const cards = DATA.machines.map((m, i) => {
    const st = machineStatus(m);
    const label = st === 'red' ? 'Runs dry soon' : st === 'yellow' ? 'Restock soon' : 'Healthy';
    const urgent = urgentSkus(m).length;
    const note = urgent ? `${urgent} SKU${urgent > 1 ? 's need' : ' needs'} attention` : 'All SKUs stocked';
    return `<div class="card" style="animation-delay:${i * 45}ms" onclick="go('machine','${m.machine_id}')">
      <div class="m-name">${esc(m.name)}</div>
      <div class="m-loc">${esc(m.location_type)} · ${esc(m.location)}</div>
      <div class="m-foot">
        <span class="badge ${st}">${label}</span>
        <span class="m-note">${note}</span>
      </div>
    </div>`;
  }).join('');
  return `<h1>Fleet</h1>
    <div class="sub">${DATA.machines.length} machines · forecast as of ${DATA.as_of}</div>
    <div class="grid">${cards}</div>`;
}

/* ---------- Machine detail ---------- */
function renderMachine(mid) {
  const m = DATA.machines.find(x => x.machine_id === mid);
  if (!m) return `<div class="empty">Machine not found.</div>`;
  const st = machineStatus(m);
  const sorted = [...m.skus].sort((a, b) =>
    (a.days_until_stockout ?? 99) - (b.days_until_stockout ?? 99));

  const rows = sorted.map(s => {
    const d = s.days_until_stockout;
    const dateStr = s.stockout_date || `beyond ${DATA.horizon_days} days`;
    return `<tr>
      <td>${esc(s.name)}</td>
      <td class="num">${s.current_stock}</td>
      <td class="num">${s.avg_daily_sales.toFixed(1)}/day</td>
      <td class="num"><span class="days-chip ${daysClass(d)}">${d == null ? DATA.horizon_days + 'd+' : d + 'd'}</span></td>
      <td>${dateStr}</td>
    </tr>`;
  }).join('');

  return `<button class="back" onclick="go('fleet')">← Back to fleet</button>
    <div class="detail-head"><h1>${esc(m.name)}</h1><span class="badge ${st}">${st.toUpperCase()}</span></div>
    <div class="sub" style="text-transform:capitalize">${esc(m.location_type)} · ${esc(m.location)}</div>
    <div class="panel">
      <h2>Inventory &amp; forecast</h2>
      <table>
        <tr><th>SKU</th><th class="num">Stock</th><th class="num">Avg sales</th><th class="num">Runs dry in</th><th>Predicted date</th></tr>
        ${rows}
      </table>
    </div>
    ${renderOrderPanel(m)}`;
}

/* ---------- Draft order ---------- */
function renderOrderPanel(m) {
  const lines = orderLines(m);
  if (!lines.length) {
    return `<div class="panel"><h2>📦 Draft purchase order</h2>
      <div class="empty">Nothing runs out within 7 days, so there is nothing to order.</div></div>`;
  }
  const total = lines.reduce((a, l) => a + l.lineCost, 0);
  const overCap = total > SPEND_CAP;
  const flagged = lines.filter(l => l.marginFlag);
  const pct = Math.min(100, total / SPEND_CAP * 100);

  const rows = lines.map(l => `<tr>
      <td>${esc(l.name)}${l.marginFlag ? '<span class="flag">⚠ under margin floor</span>' : ''}</td>
      <td class="num">${l.days_until_stockout}d</td>
      <td class="num">${l.qty}</td>
      <td class="num">${fmt$(l.unit_cost)}</td>
      <td class="num">${fmt$(l.lineCost)}</td>
    </tr>`).join('');

  let banners = '';
  if (overCap) {
    banners += `<div class="banner block"><b>Order held at the spend cap.</b>
      This order totals ${fmt$(total)} against a ${fmt$(SPEND_CAP)} per-order cap,
      ${fmt$(total - SPEND_CAP)} over the line. Trim quantities or split the order.
      The cap does not move unless the owner moves it.</div>`;
  }
  if (flagged.length) {
    banners += `<div class="banner warn">⚠ ${flagged.map(l => esc(l.name)).join(', ')}
      ${flagged.length > 1 ? 'are' : 'is'} priced under cost × ${MARGIN_FLOOR}. Selling at the
      current price breaks the margin floor. Flagged for review; you can still order it.</div>`;
  }

  return `<div class="panel">
    <h2>📦 Draft purchase order <span style="font-weight:400;color:var(--ink-faint);font-size:12.5px;font-family:'Archivo',sans-serif;text-transform:none">restock to ${TARGET_DAYS} days of cover</span></h2>
    <table>
      <tr><th>SKU</th><th class="num">Runs dry</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Line total</th></tr>
      ${rows}
      <tr class="order-total-row"><td colspan="4">Order total</td><td class="num">${fmt$(total)}</td></tr>
    </table>
    <div style="margin-top:16px">
      <div class="cap-label"><span>Spend cap</span><span class="mono">${fmt$(total)} / ${fmt$(SPEND_CAP)}</span></div>
      <div class="cap-bar"><div class="cap-fill ${overCap ? 'over' : ''}" style="width:${pct}%"></div></div>
    </div>
    ${banners}
    <div id="approve-zone">
      <button class="btn" id="approve-btn" ${overCap ? 'disabled' : ''}
        onclick="approveOrder('${m.machine_id}')">APPROVE ORDER · ${fmt$(total)}</button>
      <div class="guard-note">Approval is recorded to the audit log with a timestamp and cap check.</div>
    </div>
  </div>`;
}

function approveOrder(mid) {
  const m = DATA.machines.find(x => x.machine_id === mid);
  const lines = orderLines(m);
  const total = lines.reduce((a, l) => a + l.lineCost, 0);
  if (total > SPEND_CAP) return; // guardrail: never approvable over cap

  const entries = getAudit();
  entries.unshift({
    ts: new Date().toISOString(),
    machine_id: m.machine_id,
    machine: m.name,
    lines: lines.map(l => ({ sku: l.name, qty: l.qty, cost: +l.lineCost.toFixed(2) })),
    total: +total.toFixed(2),
    cap_check: `PASS (${fmt$(total)} ≤ ${fmt$(SPEND_CAP)})`,
    approved_by: 'Owner',
  });
  saveAudit(entries);

  document.getElementById('approve-zone').innerHTML =
    `<div class="banner ok">✓ Order approved: ${fmt$(total)} for ${lines.length} SKU${lines.length > 1 ? 's' : ''}.
     Logged to the <a href="javascript:go('audit')">audit log</a>.</div>`;
}

/* ---------- Audit log ---------- */
function renderAudit() {
  const entries = getAudit();
  const body = entries.length ? entries.map(e => `<tr>
      <td class="mono" style="font-size:12.5px">${new Date(e.ts).toLocaleString()}</td>
      <td>${esc(e.machine)}</td>
      <td class="num">${fmt$(e.total)}</td>
      <td><span class="badge green">${esc(e.cap_check)}</span></td>
      <td>${esc(e.approved_by)}</td>
    </tr>`).join('')
    : `<tr><td colspan="5"><div class="empty">No approvals yet. Approve a draft order and it will appear here.</div></td></tr>`;
  return `<h1>Audit log</h1>
    <div class="sub">Every approval is written down. Nothing is ordered without the owner.</div>
    <div class="panel"><table>
      <tr><th>Timestamp</th><th>Machine</th><th class="num">Total</th><th>Cap check</th><th>Approved by</th></tr>
      ${body}
    </table></div>`;
}

/* ---------- Boot ---------- */
fetch('../data/forecast.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; render(); })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="empty">Could not load ../data/forecast.json (${esc(err.message)}).<br>
       Run <code>python3 backend/generate_data.py &amp;&amp; python3 backend/forecast.py</code>,
       then serve the repo root, e.g. <code>python3 -m http.server 8000</code>.</div>`;
  });
</script>
</body>
</html>
