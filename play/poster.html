<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Vend City. Scan the code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --snow: #f5f3ef; --ink: #16140f; --red: #e23b2e; --cobalt: #2547d0;
    --mustard: #efaf1b; --forest: #1d6b45; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--snow); color: var(--ink); font-family: "Archivo", sans-serif;
    min-height: 100vh; display: grid; place-items: center; }
  .poster { text-align: center; padding: 40px 24px; max-width: 640px; }
  .flag { height: 8px; display: flex; width: 200px; margin: 0 auto 34px; border-radius: 4px; overflow: hidden; }
  .flag i { flex: 1; }
  .flag i:nth-child(1){background:var(--red)} .flag i:nth-child(2){background:var(--cobalt)}
  .flag i:nth-child(3){background:var(--mustard)} .flag i:nth-child(4){background:var(--forest)}
  h1 { font-family: "Archivo Black", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: clamp(38px, 6vw, 64px); line-height: .98; }
  h1 .fr { font-family: "Fraunces", serif; font-style: italic; text-transform: none; color: var(--red); }
  .sub { font-family: "Courier Prime", monospace; font-size: 13px; font-weight: 700;
    letter-spacing: .22em; color: #8b877d; margin: 14px 0 30px; }
  .qr { width: min(340px, 70vw); border: 4px solid var(--ink); border-radius: 22px; padding: 14px;
    background: var(--snow); }
  .url { font-family: "Courier Prime", monospace; font-weight: 700; font-size: clamp(15px, 2.6vw, 21px);
    margin-top: 26px; background: var(--ink); color: var(--snow); display: inline-block;
    padding: 12px 22px; border-radius: 999px; }
  .hint { margin-top: 18px; color: #6b675e; font-size: 15px; }
  @media print { .hint { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div class="poster">
  <div class="flag"><i></i><i></i><i></i><i></i></div>
  <h1>Run the fleet.<br><span class="fr">Beat the AI.</span></h1>
  <div class="sub">VEND CITY: SAN FRANCISCO · 10 DAYS · 2 VANS</div>
  <img class="qr" src="qr.png" alt="QR code to play Vend City">
  <div class="url">rickbyang.github.io/restock/play</div>
  <div class="hint">Scan with your phone camera, or type the link. Works on phones and laptops.</div>
</div>
</body>
</html>
